# eval/report.py 가 읽는 사람 판정. docs/EVAL.md 를 손으로 고치지 말고 이 파일을 고친다.
#
# 판정 근거: 답변을 인용된 청크의 인쇄 원문과, 동결 시점에 questions.yaml 에 적어둔 기대
# 답변과 대조했다. 사실은 맞지만 인용이 그 주장을 뒷받침하지 않는 답변은 X로 적는다 —
# 이번에는 그런 문항이 없었다.
#
# `answer:` 는 판정 대상이 된 답변 본문이다. 생성이 비결정적이라 재생성하면 표현이 바뀔 수
# 있고, 그때 report.py 는 사람이 읽지 않은 답변에 판정을 물려주지 않고 UNMARKED 로 되돌린다.
# 답변을 다시 읽고 두 필드를 함께 갱신한 뒤 `python -m eval.report --render-only` 로 다시
# 그린다 — 그냥 재실행하면 답변이 또 바뀐다. `없음` 문항 2개는 `answer:` 가 없다. 거부
# 문자열 대조로 기계 판정하므로 사람이 읽을 것이 없다.
q01:
  answer_correct: true
  note: 정확 — "Thanks." 한 단어
  answer: He sent back the word "Thanks."
q02:
  answer_correct: true
  note: 전보 문구 축자, "greatly exaggerated" 포함
  answer: 'He telegraphed the Associated Press: "The reports of my death are greatly exaggerated."'
q03:
  answer_correct: true
  note: Thomas Nast, 정확
  answer: He was staying at the home of political cartoonist Thomas Nast.
q04:
  answer_correct: true
  note: Langdon의 답변 축자
  answer: He said, "Take the girl. I know you better than they do."
q05:
  answer_correct: true
  note: 인용문을 그대로 재현
  answer: He says cauliflower is nothing but cabbage with a college education.
q06:
  answer_correct: true
  note: 목사의 답변은 의역, 인용한 문장은 축자
  answer: His pastor replied that he wouldn't worry about it, if he had Twain's chances.
q07:
  answer_correct: true
  note: 두 유래 모두 제시 — rivermen(Ch1 p.1)과 술집 외상(Ch3 p.35). 이번 실행은 c0001의 rivermen을 정확히 옮겼다
  answer: 'One account: as a Mississippi steamboat pilot, Clemens liked the rivermen''s call
    "Mark twain," meaning two fathoms of water — a safe depth. The other: as a Nevada newspaper
    reporter he''d enter a saloon and call "Mark twain," meaning mark two more drinks on his
    tab.'
q08:
  answer_correct: true
  note: 두 부분 모두 제시, 대주교에게 한 답변 인용이 축자
  answer: As a boy he chased a stray page blowing down the street, caught it, and found it
    came from a biography of Joan of Arc, which set him reading about her. He told the Archbishop
    of Orléans he would be "perfectly satisfied" in the next life if he were near Joan of
    Arc and as far as possible from her enemies.
q09:
  answer_correct: true
  note: 거부. 타이프라이터 이야기는 본문 1–47쪽에 없다
q10:
  answer_correct: true
  note: 거부. 모델이 Oxford 일화를 알고 있을 것이 거의 확실한데도 거부했다
