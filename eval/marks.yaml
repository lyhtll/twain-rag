# Human judgements for eval/report.py. The generated table reads this file; do not edit
# docs/EVAL.md by hand.
#
# Basis for each mark: the answer was compared against the cited chunk's printed text and
# against the expected answer recorded in questions.yaml at freeze time. A factually right
# answer whose citation did not support it would be marked X — none were.
#
# `answer:` is the exact text that was judged. Generation is nondeterministic, so a
# regenerated report can reword an answer; when it no longer matches, report.py shows
# UNMARKED instead of inheriting a verdict for an answer no one read. Re-read the answer,
# then update both fields together. The two `absent` questions carry no `answer:` — their
# mark is computed from the refusal string, not judged by hand.
